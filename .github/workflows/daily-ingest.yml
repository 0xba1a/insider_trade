name: daily-ingest

on:
  schedule:
    # 06:30 UTC Tue–Sat: after EDGAR publishes the daily index for Mon–Fri filings.
    - cron: "30 6 * * 2-6"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill this many days of history first (0 = normal daily run)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    outputs:
      site: ${{ steps.upload.outcome }}
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      INSIDER_DB: data/insider.db
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Restore database from data branch
        id: restore
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:data/insider.db > data/insider.db
            echo "Restored $(du -h data/insider.db | cut -f1) database"
          else
            echo "No data branch yet; starting with an empty database"
          fi

      - name: Backfill
        if: ${{ inputs.backfill_days != '' && inputs.backfill_days != '0' }}
        env:
          DAYS: ${{ inputs.backfill_days }}
        run: |
          insider backfill --days "$DAYS"
          # Daily history snapshots need a full 90-day window behind them.
          if [ "$DAYS" -gt 90 ]; then
            insider snapshots --since "$(date -u -d "$((DAYS - 90)) days ago" +%F)"
          fi

      - name: Ingest new filings
        run: insider ingest

      - name: Refresh market data
        # Prices/shares are best-effort; ranking still works without them.
        continue-on-error: true
        run: insider market

      - run: insider status

      - name: Build report (README section + site)
        id: report
        # Report whatever was ingested, even if a later day failed.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: insider report --readme README.md --site site --repo "$GITHUB_REPOSITORY"

      - name: Publish database to data branch
        # Publish partial progress too (each ingested day is committed atomically),
        # but never if the restore failed, which would overwrite history with a fresh DB.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s data/insider.db || { echo "no database to publish"; exit 1; }
          python -c "import sqlite3,sys; sys.exit(sqlite3.connect('data/insider.db').execute('PRAGMA integrity_check').fetchone()[0] != 'ok')"
          dir="$(mktemp -d)"
          mkdir "$dir/data"
          cp data/insider.db "$dir/data/"
          cd "$dir"
          printf '# Data branch\n\nAuto-generated by the daily-ingest workflow. Download with `insider sync`.\n' > README.md
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Insider DB $(date -u +%F)"
          # Single-commit branch, force-pushed, so the repo doesn't grow by a DB copy per day.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Commit README
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        run: |
          if git diff --quiet -- README.md; then echo "README unchanged"; exit 0; fi
          asof=$(python -c "import sqlite3; print(sqlite3.connect('data/insider.db').execute('SELECT MAX(as_of) FROM rank_snapshots').fetchone()[0])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Update insider ranking (filings through $asof)" -- README.md
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Upload site
        id: upload
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: ingest
    # Deploy whenever a site artifact was built, even if another ingest step failed.
    if: ${{ !cancelled() && needs.ingest.outputs.site == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
