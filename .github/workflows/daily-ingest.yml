name: daily-ingest

on:
  schedule:
    # 06:30 UTC Tue–Sat: after EDGAR publishes the daily index for Mon–Fri filings.
    - cron: "30 6 * * 2-6"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Backfill this many days of history first (0 = normal daily run)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      INSIDER_DB: data/insider.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Restore database from data branch
        id: restore
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:data/insider.db > data/insider.db
            echo "Restored $(du -h data/insider.db | cut -f1) database"
          else
            echo "No data branch yet; starting with an empty database"
          fi

      - name: Backfill
        if: ${{ inputs.backfill_days != '' && inputs.backfill_days != '0' }}
        run: insider backfill --days "${{ inputs.backfill_days }}"

      - name: Ingest new filings
        run: insider ingest

      - name: Refresh market data
        # Prices/shares are best-effort; ranking still works without them.
        continue-on-error: true
        run: insider market

      - run: insider status

      - name: Publish database to data branch
        # Publish partial progress too (each ingested day is committed atomically),
        # but never if the restore failed, which would overwrite history with a fresh DB.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s data/insider.db || { echo "no database to publish"; exit 1; }
          python -c "import sqlite3,sys; sys.exit(sqlite3.connect('data/insider.db').execute('PRAGMA integrity_check').fetchone()[0] != 'ok')"
          dir="$(mktemp -d)"
          mkdir "$dir/data"
          cp data/insider.db "$dir/data/"
          cd "$dir"
          printf '# Data branch\n\nAuto-generated by the daily-ingest workflow. Download with `insider sync`.\n' > README.md
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Insider DB $(date -u +%F)"
          # Single-commit branch, force-pushed, so the repo doesn't grow by a DB copy per day.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
